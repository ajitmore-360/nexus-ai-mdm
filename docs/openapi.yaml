# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# COMPONENTS
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtained from POST /auth/login

    scimBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SCIM Token
      description: SCIM bearer token obtained from POST /scim/tokens

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }

    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }

    PageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 200 }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    Forbidden:
      description: Insufficient permissions for this operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    Conflict:
      description: Resource conflict (e.g. duplicate email)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:

    # â”€â”€ Envelope schemas â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        message: { type: string }
        error: { type: string, nullable: true }

    PaginatedResponse:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        total_pages: { type: integer }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        details: { type: object, additionalProperties: true }

    BulkResult:
      type: object
      properties:
        success: { type: boolean }
        succeeded: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              error: { type: string }

    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok, healthy, degraded, unhealthy]
        service: { type: string }
        version: { type: string }
        uptime_seconds: { type: integer }

    # â”€â”€ Auth â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    LoginRequest:
      type: object
      required: [email, password, tenant_id]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        tenant_id: { type: string, format: uuid }

    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
        display_name: { type: string }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            token_type: { type: string, example: Bearer }
            expires_in: { type: integer, description: Seconds until access token expiry }
            user:
              type: object
              properties:
                identity_id: { type: string, format: uuid }
                email: { type: string }
                display_name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                tenant_id: { type: string, format: uuid }

    InviteInfo:
      type: object
      properties:
        email: { type: string }
        tenant_name: { type: string }
        invited_by: { type: string }
        expires_at: { type: string, format: date-time }

    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        display_name: { type: string }

    # â”€â”€ Users â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    UserSummary:
      type: object
      properties:
        identity_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }

    Role:
      type: string
      enum: [super_admin, admin, business_admin, steward, viewer]

    # â”€â”€ Entities â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    EntityStatus:
      type: string
      enum: [draft, pending_review, active, archived, rejected, gdpr_erased]

    EntitySummary:
      type: object
      properties:
        entity_id: { type: string, format: uuid }
        entity_type: { type: string }
        display_name: { type: string }
        status: { $ref: "#/components/schemas/EntityStatus" }
        source_system: { type: string }
        quality_score: { type: number, format: float, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Entity:
      allOf:
        - { $ref: "#/components/schemas/EntitySummary" }
        - type: object
          properties:
            attributes:
              type: object
              additionalProperties: true
            golden_record_id: { type: string, format: uuid, nullable: true }
            version: { type: integer }
            created_by: { type: string, format: uuid }

    CreateEntityRequest:
      type: object
      required: [entity_type]
      properties:
        entity_type: { type: string }
        attributes:
          type: object
          additionalProperties: true
        source_system: { type: string }
        external_id: { type: string }
        status: { $ref: "#/components/schemas/EntityStatus" }

    # â”€â”€ Entity Types â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    EntityType:
      type: object
      properties:
        entity_type_id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        description: { type: string }
        is_active: { type: boolean }
        attribute_count: { type: integer }
        created_at: { type: string, format: date-time }

    CreateEntityTypeRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string }
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
        description: { type: string }

    AttributeDefinition:
      type: object
      required: [name, code, data_type]
      properties:
        name: { type: string }
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
        data_type:
          type: string
          enum: [text, number, boolean, date, datetime, email, url, json, uuid, reference]
        is_required: { type: boolean, default: false }
        is_pii: { type: boolean, default: false }
        is_unique: { type: boolean, default: false }
        validation_rules: { type: object, additionalProperties: true }
        display_order: { type: integer }

    # â”€â”€ Relationships â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    CreateRelationshipRequest:
      type: object
      required: [type_id, to_entity_id]
      properties:
        type_id: { type: string, format: uuid }
        to_entity_id: { type: string, format: uuid }
        strength: { type: number, format: float, minimum: 0, maximum: 1 }
        metadata: { type: object, additionalProperties: true }

    CreateRelationshipTypeRequest:
      type: object
      required: [name, code, from_entity_type, to_entity_type]
      properties:
        name: { type: string }
        code: { type: string }
        from_entity_type: { type: string }
        to_entity_type: { type: string }
        is_directional: { type: boolean, default: true }

    # â”€â”€ Matching â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    MatchRequest:
      type: object
      required: [entity_type, source_attrs]
      properties:
        entity_type: { type: string }
        source_attrs:
          type: object
          additionalProperties: true
        threshold: { type: number, format: float, default: 0.8 }
        limit: { type: integer, default: 10 }
        include_semantic: { type: boolean, default: true }

    MatchResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            request_id: { type: string, format: uuid }
            candidates:
              type: array
              items:
                type: object
                properties:
                  entity_id: { type: string, format: uuid }
                  display_name: { type: string }
                  algo_score: { type: number, format: float }
                  ai_score: { type: number, format: float, nullable: true }
                  combined_score: { type: number, format: float }
                  matched_fields: { type: array, items: { type: string } }

    SemanticMatchRequest:
      type: object
      required: [tenant_id, source_attrs, candidate_attrs, entity_type]
      properties:
        tenant_id: { type: string, format: uuid }
        source_attrs: { type: object, additionalProperties: true }
        candidate_attrs: { type: object, additionalProperties: true }
        algo_score: { type: number, format: float }
        entity_type: { type: string }

    # â”€â”€ Merge â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    MergeRequest:
      type: object
      required: [source_id, target_id]
      properties:
        source_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        survivorship_rules:
          type: object
          additionalProperties:
            type: string
            enum: [most_recent, most_complete, source_priority, manual]
        manual_overrides:
          type: object
          additionalProperties: true

    # â”€â”€ Data Quality â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    CreateQualityRuleRequest:
      type: object
      required: [name, entity_type, dimension]
      properties:
        name: { type: string }
        description: { type: string }
        entity_type: { type: string }
        dimension:
          type: string
          enum: [completeness, accuracy, consistency, uniqueness, timeliness, validity]
        conditions:
          type: array
          items: { type: object, additionalProperties: true }
        severity: { type: string, enum: [info, warning, error] }
        is_active: { type: boolean, default: true }

    # â”€â”€ Domain Policies â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    DomainPolicy:
      type: object
      properties:
        match_threshold: { type: number, format: float }
        auto_merge_threshold: { type: number, format: float }
        require_approval: { type: boolean }
        survivorship_rules: { type: object, additionalProperties: true }
        required_fields: { type: array, items: { type: string } }

    # â”€â”€ Transformation Rules â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    CreateTransformationRuleRequest:
      type: object
      required: [name, entity_type, attribute_code, rule_type]
      properties:
        name: { type: string }
        entity_type: { type: string }
        attribute_code: { type: string }
        rule_type:
          type: string
          enum: [regex_replace, uppercase, lowercase, trim, format_date, lookup, conditional, custom_dsl]
        rule_config: { type: object, additionalProperties: true }
        priority: { type: integer, default: 100 }
        is_active: { type: boolean, default: true }

    # â”€â”€ SSO â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    SsoConfig:
      type: object
      properties:
        sso_config_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        provider_type: { type: string, enum: [saml, oidc] }
        is_enabled: { type: boolean }
        idp_entity_id: { type: string, nullable: true }
        idp_sso_url: { type: string, nullable: true }
        idp_slo_url: { type: string, nullable: true }
        sp_entity_id: { type: string, nullable: true }
        sp_acs_url: { type: string, nullable: true }
        default_role: { $ref: "#/components/schemas/Role" }
        auto_provision: { type: boolean }
        auto_deprovision: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    UpsertSsoConfig:
      type: object
      required: [provider_type]
      properties:
        provider_type: { type: string, enum: [saml, oidc] }
        is_enabled: { type: boolean }
        idp_entity_id: { type: string, nullable: true }
        idp_sso_url: { type: string, nullable: true }
        idp_slo_url: { type: string, nullable: true }
        idp_certificate:
          type: string
          nullable: true
          description: X.509 certificate PEM (stored encrypted)
        sp_entity_id: { type: string, nullable: true }
        sp_acs_url: { type: string, nullable: true }
        default_role: { $ref: "#/components/schemas/Role" }
        auto_provision: { type: boolean }
        auto_deprovision: { type: boolean }

    # â”€â”€ SCIM â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    ScimToken:
      type: object
      properties:
        token_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        description: { type: string }
        is_active: { type: boolean }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreatedScimToken:
      type: object
      properties:
        token: { $ref: "#/components/schemas/ScimToken" }
        raw_token:
          type: string
          description: "Plaintext bearer token â€” shown ONCE, never retrievable again. Format: AZILE_scim_{hex}"

    ScimListResponse:
      type: object
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults: { type: integer }
        startIndex: { type: integer }
        itemsPerPage: { type: integer }
        Resources:
          type: array
          items: { type: object }

    ScimUser:
      type: object
      required: [schemas, userName]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id: { type: string, format: uuid }
        userName: { type: string, format: email }
        displayName: { type: string }
        active: { type: boolean, default: true }
        emails:
          type: array
          items:
            type: object
            properties:
              value: { type: string, format: email }
              primary: { type: boolean }
        name:
          type: object
          properties:
            formatted: { type: string }
            givenName: { type: string }
            familyName: { type: string }
        meta:
          type: object
          properties:
            resourceType: { type: string, example: User }
            created: { type: string, format: date-time }
            lastModified: { type: string, format: date-time }
            location: { type: string }

    ScimGroup:
      type: object
      required: [schemas, displayName]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        id: { type: string }
        displayName: { type: string, description: "Maps to Nexus role name" }
        members:
          type: array
          items:
            type: object
            properties:
              value: { type: string, description: User UUID }
              display: { type: string }

    ScimPatchOp:
      type: object
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          items: { type: string }
          example: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op: { type: string, enum: [add, remove, replace] }
              path: { type: string }
              value: {}

    # â”€â”€ AI Service â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    McpRequest:
      type: object
      required: [tenant_id, user_id, prompt]
      properties:
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        prompt: { type: string }
        tool: { type: string, nullable: true }
        response_format: { type: string, enum: [text, json], default: text }

    McpResponse:
      type: object
      properties:
        success: { type: boolean }
        result: { type: string }
        tool_results: { type: array, items: { type: object } }
        error: { type: string, nullable: true }

    # â”€â”€ Ingestion â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

    IngestBatchRequest:
      type: object
      required: [entity_type, records]
      properties:
        entity_type: { type: string }
        source_system: { type: string }
        records:
          type: array
          items:
            type: object
            properties:
              external_id: { type: string }
              attributes: { type: object, additionalProperties: true }
        on_conflict: { type: string, enum: [update, skip, error], default: update }

    CreateSourceSystemRequest:
      type: object
      required: [name, code, system_type]
      properties:
        name: { type: string }
        code: { type: string }
        system_type:
          type: string
          enum: [rest_api, database, kafka, file_upload, salesforce, sap, custom]
        connection_config:
          type: object
          additionalProperties: true
          description: System-type-specific config (URLs, credentials stored encrypted)
        sync_schedule: { type: string, description: "Cron expression" }
        is_active: { type: boolean, default: true }
