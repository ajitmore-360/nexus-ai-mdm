  # â”€â”€ SAML 2.0 Endpoints (no auth â€” called by IdP / browser) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /saml/{tenant_id}/metadata:
    get:
      tags: [SSO Configuration]
      summary: SP metadata XML (give this URL to your IdP)
      security: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: SAML SP metadata
          content:
            application/xml:
              schema: { type: string }

  /saml/{tenant_id}/init:
    get:
      tags: [SSO Configuration]
      summary: Initiate SAML SSO login (redirects to IdP)
      security: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: relay_state
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to IdP SSO URL

  /saml/{tenant_id}/acs:
    post:
      tags: [SSO Configuration]
      summary: SAML Assertion Consumer Service (called by IdP)
      security: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse: { type: string, description: "Base64-encoded SAML assertion" }
                RelayState: { type: string }
      responses:
        "200":
          description: JWT tokens issued (or redirect with token)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  # â”€â”€ SCIM Token Management â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /scim/tokens:
    get:
      tags: [SCIM 2.0]
      summary: List SCIM bearer tokens for the current tenant
      responses:
        "200":
          description: Tokens list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ScimToken" }

    post:
      tags: [SCIM 2.0]
      summary: Create a SCIM bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, example: "Okta SCIM integration" }
                expires_at: { type: string, format: date-time, description: "Omit for non-expiring token" }
      responses:
        "201":
          description: Token created â€” raw token shown ONCE
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CreatedScimToken" }

  /scim/tokens/{id}:
    delete:
      tags: [SCIM 2.0]
      summary: Revoke a SCIM bearer token
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204":
          description: Token revoked

  # â”€â”€ SCIM 2.0 User Provisioning â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /scim/{tenant_id}/v2/ServiceProviderConfig:
    get:
      tags: [SCIM 2.0]
      summary: SCIM service provider configuration (RFC 7643 Â§5)
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "200":
          description: SCIM ServiceProviderConfig

  /scim/{tenant_id}/v2/Schemas:
    get:
      tags: [SCIM 2.0]
      summary: SCIM schema definitions
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "200":
          description: SCIM schemas

  /scim/{tenant_id}/v2/ResourceTypes:
    get:
      tags: [SCIM 2.0]
      summary: SCIM resource types
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "200":
          description: Resource types

  /scim/{tenant_id}/v2/Users:
    get:
      tags: [SCIM 2.0]
      summary: List / filter SCIM users
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - name: filter
          in: query
          schema: { type: string, example: 'userName eq "alice@corp.com"' }
        - name: startIndex
          in: query
          schema: { type: integer, default: 1 }
        - name: count
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: SCIM ListResponse
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimListResponse" }

    post:
      tags: [SCIM 2.0]
      summary: Provision a new user via SCIM
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: "#/components/schemas/ScimUser" }
      responses:
        "201":
          description: User provisioned
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }
        "409":
          description: User already exists

  /scim/{tenant_id}/v2/Users/{id}:
    get:
      tags: [SCIM 2.0]
      summary: Get a SCIM user
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: SCIM user
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [SCIM 2.0]
      summary: Replace a SCIM user
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: "#/components/schemas/ScimUser" }
      responses:
        "200":
          description: User replaced
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimUser" }

    patch:
      tags: [SCIM 2.0]
      summary: Partial update a SCIM user (activate/deactivate, name change)
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: "#/components/schemas/ScimPatchOp" }
      responses:
        "200":
          description: User updated

    delete:
      tags: [SCIM 2.0]
      summary: Deprovision a SCIM user
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204":
          description: User deprovisioned

  /scim/{tenant_id}/v2/Groups:
    get:
      tags: [SCIM 2.0]
      summary: List SCIM groups (mapped to Nexus roles)
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - name: filter
          in: query
          schema: { type: string }
      responses:
        "200":
          description: SCIM ListResponse with groups
          content:
            application/scim+json:
              schema: { $ref: "#/components/schemas/ScimListResponse" }

    post:
      tags: [SCIM 2.0]
      summary: Create a SCIM group (maps to a Nexus role)
      security:
        - scimBearerAuth: []
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: "#/components/schemas/ScimGroup" }
      responses:
        "201":
