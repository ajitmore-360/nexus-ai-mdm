openapi: "3.1.0"
info:
  title: Azile AI MDM API
  version: "3.1.0"
  description: |
    Azile AI MDM is a hub-and-spoke Master Data Management platform built on Rust microservices.

    ## Services
    | Service | Port | Purpose |
    |---------|------|---------|
    | API Gateway | 8080 | Single entry point; auth + rate-limit + proxy |
    | MDM Core | 8081 | Entities, matching, merge, approval, admin config |
    | AI Service | 8082 | LLM copilot, embeddings, semantic matching, RAG |
    | Policy Service | 8083 | Policy evaluation, GDPR, consent |
    | Ingest Service | 8084 | Batch/CSV/REST ingestion, source systems |
    | Search Service | 8085 | Full-text search, autocomplete |
    | Notification Service | 8086 | In-app notifications, webhooks, email |

    ## Authentication
    All protected endpoints require a JWT Bearer token obtained from `POST /auth/login`.
    SCIM 2.0 endpoints use a separate SCIM bearer token obtained from `POST /scim/tokens`.

    Standard request headers:
    - `Authorization: Bearer <jwt>` â€” JWT from login
    - `x-tenant-id` â€” Tenant UUID (injected by gateway; required on direct calls)
    - `x-correlation-id` â€” Optional idempotency / tracing ID

  contact:
    name: Azile MDM Support
    email: ajit.more@lithytree.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: API Gateway (recommended entry point)
  - url: http://localhost:8081
    description: MDM Core (direct)
  - url: http://localhost:8082
    description: AI Service (direct)
  - url: http://localhost:8084
    description: Ingest Service (direct)

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Authentication
    description: Login, token refresh, password management, SSO exchange
  - name: Users
    description: User management and role assignment
  - name: Entities
    description: Core entity CRUD and lifecycle
  - name: Entity Types
    description: Entity type and attribute schema configuration
  - name: Relationships
    description: Entity-to-entity relationship management
  - name: Cross-References
    description: External system ID mapping
  - name: Entity Hierarchy
    description: Parent-child tree operations
  - name: History & Bitemporal
    description: Version history and point-in-time queries
  - name: Comments
    description: Entity comments and collaboration
  - name: Matching
    description: Duplicate detection, review queue, bulk decisions
  - name: Merge & Unmerge
    description: Entity merge and split operations
  - name: Golden Records
    description: Survivorship-managed canonical records
  - name: Lineage
    description: Data lineage graph and statistics
  - name: Data Quality
    description: Quality rules, violations, and analytics
  - name: Data Profiling
    description: Attribute-level statistical profiling
  - name: Quality Analytics
    description: Trend analysis and dimension breakdowns
  - name: Governance
    description: Data ownership and stewardship assignments
  - name: Domain Policies
    description: Per-entity-type policy overrides
  - name: Transformation Rules
    description: Attribute transformation DSL rules
  - name: Reference Data
    description: Controlled vocabulary lists and submaster types
  - name: Party Roles
    description: Functional role tags on entity records
  - name: AI Suggestions
    description: AI-generated enrichment and anomaly suggestions
  - name: AI Copilot
    description: LLM query, streaming, and RAG endpoints
  - name: Ingestion
    description: Batch, CSV, and REST data ingestion
  - name: Source Systems
    description: Source system configuration
  - name: Distribution
    description: Downstream distribution jobs
  - name: Notifications
    description: In-app notification management
  - name: Notification Subscriptions
    description: User subscription management
  - name: Tasks
    description: Workflow tasks and SLA management
  - name: Dashboard
    description: Dashboard statistics and activity feed
  - name: Approval Workflow
    description: Entity submit-for-review and approval/rejection
  - name: Bulk Operations
    description: Batch entity status changes, exports, tagging
  - name: SSO Configuration
    description: SAML 2.0 / OIDC identity provider configuration
  - name: SCIM 2.0
    description: RFC 7643/7644 user and group provisioning
  - name: Administration
    description: Tenant and license management (super-admin)
  - name: Branding
    description: Tenant branding customisation
  - name: Audit
    description: Immutable audit event log
  - name: Policy Evaluation
    description: Policy-service rule evaluation and GDPR endpoints

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# PATHS
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
paths:

  # â”€â”€ Health â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /health:
    get:
      tags: [Health]
      summary: Service health
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /health/live:
    get:
      tags: [Health]
      summary: Kubernetes liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /health/ready:
    get:
      tags: [Health]
      summary: Kubernetes readiness probe (checks DB + dependencies)
      security: []
      responses:
        "200":
          description: Service is ready to receive traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Service is not ready

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics scrape endpoint
      security: []
      responses:
        "200":
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string

  # â”€â”€ Authentication â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and obtain JWT tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/accept-invite:
    post:
      tags: [Authentication]
      summary: Accept invitation and set password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: User created and logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/invite-info:
    get:
      tags: [Authentication]
      summary: Look up invite token details
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteInfo" }
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, tenant_id]
              properties:
                email: { type: string, format: email }
                tenant_id: { type: string, format: uuid }
      responses:
        "200":
          description: Reset email sent (always 200 to prevent email enumeration)

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password using token from email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password updated
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password changed
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/sso-exchange:
    post:
      tags: [Authentication]
      summary: Exchange SSO token for JWT pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sso_token]
              properties:
                sso_token: { type: string }
      responses:
        "200":
          description: JWT pair issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  # â”€â”€ Users â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /users:
    get:
      tags: [Users]
      summary: List users in the current tenant
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginatedResponse" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/UserSummary" }

  /users/invite:
    post:
      tags: [Users]
      summary: Invite a user by email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "200":
          description: Invite sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Change a user's role
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Role updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # â”€â”€ Entities â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /entities:
    get:
      tags: [Entities]
      summary: List / search entities
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - name: search
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
          description: Entity type code filter
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EntityStatus" }
        - name: source_system
          in: query
          schema: { type: string }
        - name: sort_by
          in: query
          schema: { type: string, default: created_at }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Entity list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/PaginatedResponse" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EntitySummary" }

    post:
      tags: [Entities]
      summary: Create a new entity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEntityRequest" }
      responses:
        "201":
          description: Entity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /entities/{id}:
    get:
      tags: [Entities]
      summary: Get a single entity by ID
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Entity object
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Entity" }
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Entities]
      summary: Partial update of an entity
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes: { type: object, additionalProperties: true }
                status: { $ref: "#/components/schemas/EntityStatus" }
      responses:
        "200":
          description: Entity updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "404":
          $ref: "#/components/responses/NotFound"

  /entities/{id}/gdpr-erase:
    delete:
      tags: [Entities]
      summary: GDPR erasure â€” permanently remove PII from an entity
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Entity PII erased
        "404":
          $ref: "#/components/responses/NotFound"

  # â”€â”€ Approval Workflow â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /entities/pending-approvals:
    get:
      tags: [Approval Workflow]
      summary: List entities pending steward approval
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Pending entities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /entities/{id}/submit-for-review:
    post:
      tags: [Approval Workflow]
      summary: Submit an entity for steward review
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Submitted
        "404":
          $ref: "#/components/responses/NotFound"

  /entities/{id}/approve:
    post:
      tags: [Approval Workflow]
      summary: Approve an entity (steward/admin)
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        "200":
          description: Approved

  /entities/{id}/reject:
    post:
      tags: [Approval Workflow]
      summary: Reject an entity (steward/admin)
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        "200":
          description: Rejected

  /entities/bulk-approve:
    post:
      tags: [Approval Workflow]
      summary: Bulk approve entities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_ids]
              properties:
                entity_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Batch result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }

  /entities/bulk-reject:
    post:
      tags: [Approval Workflow]
      summary: Bulk reject entities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_ids]
              properties:
                entity_ids:
                  type: array
                  items: { type: string, format: uuid }
                notes: { type: string }
      responses:
        "200":
          description: Batch result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }

  # â”€â”€ Bulk Operations â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /entities/bulk/status:
    post:
      tags: [Bulk Operations]
      summary: Bulk update entity status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_ids, status]
              properties:
                entity_ids:
                  type: array
                  items: { type: string, format: uuid }
                status: { $ref: "#/components/schemas/EntityStatus" }
      responses:
        "200":
          description: Status updated

  /entities/bulk/export:
    post:
      tags: [Bulk Operations]
      summary: Bulk export entities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters: { type: object }
                format: { type: string, enum: [csv, json, parquet] }
      responses:
        "200":
          description: Exported data or job ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /entities/bulk/tag:
    post:
      tags: [Bulk Operations]
      summary: Bulk tag entities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_ids, tags]
              properties:
                entity_ids:
                  type: array
                  items: { type: string, format: uuid }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Tags applied

  # â”€â”€ Entity Hierarchy â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

  /entities/hierarchy/roots:
    get:
      tags: [Entity Hierarchy]
      summary: List root-level entities (no parent)
      responses:
        "200":
          description: Root entities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /entities/{id}/children:
    get:
      tags: [Entity Hierarchy]
      summary: Get direct children of an entity
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Children array
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /entities/{id}/ancestors:
    get:
      tags: [Entity Hierarchy]
      summary: Get all ancestors up to root
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Ancestors array
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /entities/{id}/subtree:
    get:
      tags: [Entity Hierarchy]
      summary: Get full subtree rooted at an entity
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Nested subtree JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }

  /entities/{id}/parent:
    patch:
      tags: [Entity Hierarchy]
      summary: Set parent entity
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "200":
          description: Parent updated

  # â”€â”€ History & Bitemporal â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€

