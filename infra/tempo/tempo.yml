# ============================================================================
# Grafana Tempo — All-in-one configuration for Nexus AI MDM
# ============================================================================
# Single-binary mode: distributor + ingester + querier + compactor all in one
# process. Suitable for development and small production deployments.
# For HA production, split into separate components.
# ============================================================================

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

# ── OTLP receivers (gRPC :4317 and HTTP :4318) ───────────────────────────────
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# ── Ingester: buffer spans in memory before flushing to storage ──────────────
ingester:
  max_block_duration: 5m
  trace_idle_period: 10s
  max_block_bytes: 100_000_000   # 100 MB per block

# ── Compactor: merge and expire old trace blocks ─────────────────────────────
compactor:
  compaction:
    block_retention: 72h          # keep traces for 3 days in dev
    compacted_block_retention: 1h

# ── Storage: local filesystem (switch to S3/GCS for production HA) ───────────
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 100
      queue_depth: 10000

# ── Query frontend ────────────────────────────────────────────────────────────
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09

querier:
  max_concurrent_queries: 20
  search:
    prefer_self: 10

# ── Metrics generator: derives RED metrics from trace data ───────────────────
# Writes to Prometheus remote-write endpoint so Grafana can correlate traces
# with metrics on the same dashboard.
metrics_generator:
  registry:
    external_labels:
      platform: nexus-ai-mdm
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      dimensions:
        - service.name
    span_metrics:
      dimensions:
        - service.name
        - http.method
        - http.status_code

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
