global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    platform:    azile-ai-mdm

# â”€â”€ Alert rules â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
rule_files:
  - "alerts.yml"

# â”€â”€ Alertmanager â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # â”€â”€ Nexus Services â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - job_name: api-gateway
    static_configs:
      - targets: ['api-gateway:8080']
        labels:  { service: api-gateway }
    metrics_path: /metrics

  - job_name: mdm-core
    static_configs:
      - targets: ['mdm-core:8081']
        labels:  { service: mdm-core }
    metrics_path: /metrics

  - job_name: ai-service
    static_configs:
      - targets: ['ai-service:8082']
        labels:  { service: ai-service }
    metrics_path: /metrics

  - job_name: ingest-service
    static_configs:
      - targets: ['ingest-service:8083']
        labels:  { service: ingest-service }
    metrics_path: /metrics

  - job_name: policy-service
    static_configs:
      - targets: ['policy-service:8084']
        labels:  { service: policy-service }
    metrics_path: /metrics

  - job_name: search-service
    static_configs:
      - targets: ['search-service:8085']
        labels:  { service: search-service }
    metrics_path: /metrics

  - job_name: notification-service
    static_configs:
      - targets: ['notification-service:8086']
        labels:  { service: notification-service }
    metrics_path: /metrics

  - job_name: distribution-service
    static_configs:
      - targets: ['distribution-service:8089']
        labels:  { service: distribution-service }
    metrics_path: /metrics

  - job_name: kafka-event-service
    static_configs:
      - targets: ['kafka-event-service:8087']
        labels:  { service: kafka-event-service }
    metrics_path: /metrics

  - job_name: enrichment-service
    static_configs:
      - targets: ['enrichment-service:8088']
        labels:  { service: enrichment-service }
    metrics_path: /metrics

  - job_name: tenant-service
    static_configs:
      - targets: ['tenant-service:8090']
        labels:  { service: tenant-service }
    metrics_path: /metrics

  # â”€â”€ Kafka â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - job_name: kafka
    static_configs:
      - targets: ['kafka:9101']
        labels:  { service: kafka }

  # â”€â”€ PostgreSQL (postgres_exporter) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:  { service: postgres }

  # â”€â”€ Prometheus self-monitoring â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
