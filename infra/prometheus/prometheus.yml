global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    platform:    nexus-ai-mdm

scrape_configs:
  # ── Nexus Services ──────────────────────────────────────────────────────────
  - job_name: api-gateway
    static_configs:
      - targets: ['api-gateway:8080']
        labels:  { service: api-gateway }
    metrics_path: /metrics

  - job_name: mdm-core
    static_configs:
      - targets: ['mdm-core:8081']
        labels:  { service: mdm-core }
    metrics_path: /metrics

  - job_name: ai-service
    static_configs:
      - targets: ['ai-service:8082']
        labels:  { service: ai-service }
    metrics_path: /metrics

  - job_name: ingest-service
    static_configs:
      - targets: ['ingest-service:8083']
        labels:  { service: ingest-service }
    metrics_path: /metrics

  - job_name: policy-service
    static_configs:
      - targets: ['policy-service:8084']
        labels:  { service: policy-service }
    metrics_path: /metrics

  - job_name: search-service
    static_configs:
      - targets: ['search-service:8085']
        labels:  { service: search-service }
    metrics_path: /metrics

  - job_name: notification-service
    static_configs:
      - targets: ['notification-service:8086']
        labels:  { service: notification-service }
    metrics_path: /metrics

  - job_name: distribution-service
    static_configs:
      - targets: ['distribution-service:8089']
        labels:  { service: distribution-service }
    metrics_path: /metrics

  # ── Kafka ────────────────────────────────────────────────────────────────────
  - job_name: kafka
    static_configs:
      - targets: ['kafka:9101']
        labels:  { service: kafka }

  # ── Prometheus self-monitoring ───────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
