# ============================================================================
# Azile AI MDM — Complete Production-Ready Stack
# ============================================================================
#
# QUICK START:
#   cd infra
#   docker compose up -d
#   docker compose logs -f mdm-core    # watch migrations run
#
# REBUILD ALL SERVICES (after code changes):
#   docker compose up -d --build
#
# WIPE EVERYTHING (fresh start):
#   docker compose down -v --remove-orphans
#   docker compose up -d
#
# ACCESS POINTS (once healthy):
#   UI:           http://localhost:3000
#   API Gateway:  http://localhost:8080
#   PgAdmin:      http://localhost:5050  (admin@nexus.ai / see .env)
#   Kafka UI:     http://localhost:9000
#   Grafana:      http://localhost:3001  (admin / see .env)
#   Prometheus:   http://localhost:9090
#
# BOOT SEQUENCE:
#   1. postgres   → runs init scripts (roles, schemas, extensions)
#   2. redis + zookeeper + kafka + opa  → infrastructure (parallel)
#   3. mdm-core   → runs ALL database migrations (tables, sequences, schemas)
#   4. All other services  → depend on mdm-core:healthy (migrations complete)
#
# CREDENTIALS (override in infra/.env):
#   PostgreSQL:    postgres / azile_dev_2024
#   Redis:         azile_redis_pass
#   PgAdmin:       admin@nexus.ai / AZILE_pgadmin_dev
#   Grafana:       admin / AZILE_grafana_dev
#   JWT Secret:    azile-local-dev-jwt-secret-min-32-chars!!
# ============================================================================

# ── Shared environment fragments ─────────────────────────────────────────────
x-db-env: &db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-azile_dev_2024}@postgres:5432/azile_mdm

x-redis-env: &redis-env
  REDIS_URL:        redis://:${REDIS_PASSWORD:-azile_redis_pass}@redis:6379
  REDIS_KEY_PREFIX: nexus

x-auth-env: &auth-env
  AUTH_DISABLED:        ${AUTH_DISABLED:-false}
  JWT_SECRET:           ${JWT_SECRET:-azile-local-dev-jwt-secret-min-32-chars!!}
  API_BEARER_TOKEN:     ${API_BEARER_TOKEN:-azile-local-dev-token}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}

x-obs-env: &obs-env
  RUST_LOG:                       ${RUST_LOG:-info}
  JSON_LOGS:                      ${JSON_LOGS:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT:    ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}

x-kafka-env: &kafka-env
  KAFKA_BROKERS:   kafka:29092
  KAFKA_GROUP_ID:  azile-default

x-service-deps-infra: &deps-infra
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA PLANE
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg16
    container_name: azile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azile_dev_2024}
      POSTGRES_DB:       azile_mdm
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro    # roles, schemas, extensions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d azile_mdm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:   { cpus: "2.0", memory: 4G }
        reservations: { cpus: "0.5", memory: 512M }

  redis:
    image: redis:7-alpine
    container_name: azile-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-azile_redis_pass}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-azile_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:   { cpus: "0.5", memory: 2G }
        reservations: { cpus: "0.1", memory: 256M }

  # ═══════════════════════════════════════════════════════════════════════════
  # ADMIN UIs (dev only — localhost-bound)
  # ═══════════════════════════════════════════════════════════════════════════

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: azile-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@nexus.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-AZILE_pgadmin_dev}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "Azile MDM Internal — Authorised Access Only"
      PGADMIN_CONFIG_SESSION_EXPIRATION_TIME: 60
    ports:
      - "127.0.0.1:5050:80"    # localhost-only — never expose on 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ═══════════════════════════════════════════════════════════════════════════
  # MESSAGE PLANE
  # ═══════════════════════════════════════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: azile-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT:         2181
      ZOOKEEPER_TICK_TIME:           2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"\" > /dev/tcp/localhost/2181' && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: azile-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_DELETE_TOPIC_ENABLE:              "true"
      KAFKA_LOG_RETENTION_HOURS:              168
      KAFKA_LOG4J_ROOT_LOGLEVEL:              WARN
      KAFKA_LOG4J_LOGGERS:                    "kafka=WARN,kafka.controller=WARN,kafka.log.LogCleaner=WARN,state.change.logger=WARN,kafka.producer.async.DefaultEventHandler=WARN"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: azile-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME:             nexus-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "9000:8080"    # Changed from 8085 to avoid conflict with search-service
    deploy:
      resources:
        limits: { memory: 256M }

  # ═══════════════════════════════════════════════════════════════════════════
  # AI PLANE
  # ═══════════════════════════════════════════════════════════════════════════

  ollama:
    image: ollama/ollama:latest
    container_name: azile-ollama
    restart: unless-stopped
    # SECURITY: No external port — only ai-service can reach Ollama
    # ports:
    #   - "127.0.0.1:11434:11434"   # Uncomment ONLY for local debugging
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_ORIGINS:    "http://ai-service:8082"
    # Remove the deploy.resources.reservations block if no GPU available
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 8G }

  # Pull required LLM models once after Ollama starts
  ollama-init:
    image: curlimages/curl:latest
    container_name: azile-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo 'Pulling llama3.2:3b (may take several minutes)...' &&
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name":"llama3.2:3b"}' --max-time 600 &&
        echo 'Pulling nomic-embed-text...' &&
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name":"nomic-embed-text"}' --max-time 300 &&
        echo 'All models ready'

  # ═══════════════════════════════════════════════════════════════════════════
  # GOVERNANCE
  # ═══════════════════════════════════════════════════════════════════════════

  opa:
    image: openpolicyagent/opa:latest
    container_name: azile-opa
    restart: unless-stopped
    command: ["run", "--server", "--log-format=json", "--log-level=error",
              "--set=decision_logs.console=true"]
    ports:
      - "8181:8181"
    volumes:
      - ./opa/policies:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # ═══════════════════════════════════════════════════════════════════════════
  # NEXUS SERVICES  —  Boot in two waves:
  #   Wave 1: mdm-core (runs migrations → ALL tables created)
  #   Wave 2: Everything else (depends on mdm-core being healthy)
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── Wave 1: MDM Core — MIGRATION OWNER ───────────────────────────────────
  mdm-core:
    build:
      context: ..
      dockerfile: services/mdm-core/Dockerfile
    container_name: azile-mdm-core
    restart: unless-stopped
    <<: *deps-infra
    environment:
      <<: [*db-env, *redis-env, *auth-env, *obs-env]
      AI_SERVICE_URL: http://ai-service:8082
      RUST_LOG: "mdm_core=info,database=info"
    ports:
      - "8081:8081"
    healthcheck:
      # Health check verifies DB connectivity; migrations complete before healthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:   { cpus: "2.0", memory: 1G }
        reservations: { cpus: "0.25", memory: 256M }

  # ─── Wave 2: All other services (depend on mdm-core:healthy) ──────────────

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: nexus-api-gateway
    restart: unless-stopped
    depends_on:
      mdm-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*redis-env, *auth-env, *obs-env]
      GATEWAY_PORT:               "8080"
      MDM_CORE_URL:               http://mdm-core:8081
      AI_SERVICE_URL:             http://ai-service:8082
      INGEST_SERVICE_URL:         http://ingest-service:8083
      POLICY_SERVICE_URL:         http://policy-service:8084
      SEARCH_SERVICE_URL:         http://search-service:8085
      NOTIFICATION_SERVICE_URL:   http://notification-service:8086
      DISTRIBUTION_SERVICE_URL:   http://distribution-service:8089
      TENANT_SERVICE_URL:         http://tenant-service:8090
      ALLOWED_ORIGINS:            ${ALLOWED_ORIGINS:-http://localhost:3000}
      APP_ENV:                    ${APP_ENV:-development}
      RUST_LOG:                   "api_gateway=info"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:   { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.1", memory: 128M }

  ai-service:
    build:
      context: ..
      dockerfile: services/ai-service/Dockerfile
    container_name: nexus-ai-service
    restart: unless-stopped
    depends_on:
      mdm-core:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env, *obs-env]
      OLLAMA_URL:      http://ollama:11434
      LLM_MODEL:       ${LLM_MODEL:-llama3.2:3b}
      EMBED_MODEL:     ${EMBED_MODEL:-nomic-embed-text}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      RUST_LOG:        "ai_service=info"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:   { cpus: "1.0", memory: 1G }
        reservations: { cpus: "0.1", memory: 256M }

  ingest-service:
    build:
      context: ..
      dockerfile: services/ingest-service/Dockerfile
    container_name: nexus-ingest-service
    restart: unless-stopped
    depends_on:
      mdm-core:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env, *kafka-env, *obs-env]
      MDM_CORE_URL:         http://mdm-core:8081
      INGEST_PORT:          "8083"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      RUST_LOG:             "ingest_service=info"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:   { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.1", memory: 128M }

  policy-service:
    build:
      context: ..
      dockerfile: services/policy-service/Dockerfile
    container_name: nexus-policy-service
    restart: unless-stopped
    depends_on:
      mdm-core:
        condition: service_healthy
      opa:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env, *obs-env]
      OPA_URL:             http://opa:8181
      POLICY_SERVICE_PORT: "8084"
      RUST_LOG:            "policy_service=info"
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }

  search-service:
    build:
      context: ..
      dockerfile: services/search-service/Dockerfile
    container_name: nexus-search-service
    restart: unless-stopped
    depends_on:
      mdm-core:
        condition: service_healthy
    environment:
      <<: [*db-env, *obs-env]
      SEARCH_SERVICE_PORT: "8085"
      RUST_LOG:            "search_service=info"
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nexus-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    deploy:
      resources:
        limits: { memory: 64M }

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: nexus-notification-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      <<: [*db-env, *redis-env, *obs-env]
      NOTIFICATION_PORT: "8086"
      RUST_LOG:          "notification_service=info"
      SMTP_HOST:         "${SMTP_HOST:-mailhog}"
      SMTP_PORT:         "${SMTP_PORT:-1025}"
      SMTP_FROM:         "${SMTP_FROM:-Azile AI MDM <noreply@azile-mdm.io>}"
      SMTP_INSECURE:     "${SMTP_INSECURE:-true}"
      SMTP_USER:         "${SMTP_USER:-}"
      SMTP_PASS:         "${SMTP_PASS:-}"
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }

  distribution-service:
    build:
      context: ..
      dockerfile: services/distribution-service/Dockerfile
    container_name: nexus-distribution-service
    restart: unless-stopped
    depends_on:
      mdm-core:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*db-env, *kafka-env, *obs-env]
      DISTRIBUTION_PORT:    "8089"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      RUST_LOG:             "distribution_service=info"
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8089/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }

  enrichment-service:
    build:
      context: ..
      dockerfile: services/enrichment-service/Dockerfile
    container_name: nexus-enrichment-service
    restart: unless-stopped
    depends_on:
      mdm-core:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env, *kafka-env, *obs-env]
      MDM_CORE_URL:         http://mdm-core:8081
      ENRICHMENT_PORT:      "8088"
      ENRICHMENT_MOCK_MODE: "true"
      ENABLE_DNB:           "true"
      ENABLE_EXPERIAN:      "true"
      ENABLE_ADDRESS_VALIDATION: "true"
      RUST_LOG:             "enrichment_service=info"
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 512M }

  tenant-service:
    build:
      context: ..
      dockerfile: services/tenant-service/Dockerfile
    container_name: nexus-tenant-service
    restart: unless-stopped
    depends_on:
      mdm-core:
        condition: service_healthy
    environment:
      <<: [*db-env, *redis-env, *obs-env]
      TENANT_SERVICE_PORT: "8090"
      RUST_LOG:            "tenant_service=info"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }

  kafka-event-service:
    build:
      context: ..
      dockerfile: services/kafka-event-service/Dockerfile
    container_name: azile-kafka-event-service
    restart: unless-stopped
    depends_on:
      mdm-core:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: [*db-env, *kafka-env, *obs-env]
      RUST_LOG: "kafka_event_service=info"
    deploy:
      resources:
        limits: { memory: 256M }

  # ═══════════════════════════════════════════════════════════════════════════
  # UI
  # ═══════════════════════════════════════════════════════════════════════════

  azile-ui:
    build:
      context: ../ui/azile_mdm_ui
      dockerfile: Dockerfile
    container_name: azile-ui
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # OBSERVABILITY
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Grafana Tempo — distributed trace backend ────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: azile-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo UI / query API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  prometheus:
    image: prom/prometheus:latest
    container_name: azile-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--log.level=warn'
    ports:
      - "9090:9090"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  alertmanager:
    image: prom/alertmanager:latest
    container_name: azile-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--log.level=warn'
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-http://localhost:9999/alert}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"   # localhost-only
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: azile-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-azile_dev_2024}@postgres:5432/azile_mdm?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9187/metrics | head -1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  grafana:
    image: grafana/grafana-oss:latest
    container_name: azile-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-AZILE_grafana_dev}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_LOG_LEVEL:               "warn"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/azile_overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256M }

# ═══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════

volumes:
  postgres_data:      { driver: local }
  redis_data:         { driver: local }
  pgadmin_data:       { driver: local }
  zookeeper_data:     { driver: local }
  zookeeper_log:      { driver: local }
  kafka_data:         { driver: local }
  ollama_models:      { driver: local }
  prometheus_data:    { driver: local }
  alertmanager_data:  { driver: local }
  grafana_data:       { driver: local }
  tempo_data:         { driver: local }
