version: "3.9"

services:

  #
  # ==========================================
  # POSTGRES
  # ==========================================
  #

  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_mdm

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  #
  # ==========================================
  # PGADMIN
  # ==========================================
  #

  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: nexus-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexus.ai
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json

    depends_on:
      - postgres

  #
  # ==========================================
  # ZOOKEEPER
  # ==========================================
  #

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0

    container_name: nexus-zookeeper

    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

  #
  # ==========================================
  # KAFKA
  # ==========================================
  #

  kafka:
    image: confluentinc/cp-kafka:7.5.0

    container_name: nexus-kafka

    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  #
  # ==========================================
  # KAFKA UI
  # ==========================================
  #

  kafka-ui:
    image: provectuslabs/kafka-ui:latest

    container_name: nexus-kafka-ui

    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "8085:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: nexus-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  postgres_data:
  pgadmin_data: