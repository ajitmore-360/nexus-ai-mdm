{{/*
=============================================================================
ClusterSecretStore â€” provider backend for ExternalSecret resources
Rendered only when externalSecrets.enabled is true.

Supported providers (set via externalSecrets.provider):
  aws    â†’ AWS Secrets Manager (uses IRSA / pod identity for auth)
  vault  â†’ HashiCorp Vault (token or Kubernetes auth)

Install external-secrets operator first:
  helm repo add external-secrets https://charts.external-secrets.io
  helm install external-secrets external-secrets/external-secrets \
    --namespace external-secrets --create-namespace
=============================================================================
*/}}
{{- if .Values.externalSecrets.enabled }}

{{- if eq .Values.externalSecrets.provider "aws" }}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ include "azile-mdm.fullname" . }}-aws-secretsmanager
  labels:
    {{- include "azile-mdm.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.aws.region | required "externalSecrets.aws.region is required" }}
      auth:
        {{- if .Values.externalSecrets.aws.roleArn }}
        jwt:
          serviceAccountRef:
            name: {{ include "azile-mdm.fullname" . }}-external-secrets
            namespace: {{ include "azile-mdm.namespace" . }}
        {{- else }}
        # Falls back to EC2 instance profile / node IAM role when roleArn is not set.
        # Prefer IRSA (roleArn) in production for least-privilege access.
        secretRef: {}
        {{- end }}
{{- end }}

{{- if eq .Values.externalSecrets.provider "vault" }}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ include "azile-mdm.fullname" . }}-vault
  labels:
    {{- include "azile-mdm.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vault.server | required "externalSecrets.vault.server is required" }}
      path: {{ .Values.externalSecrets.vault.path | default "secret" }}
      version: {{ .Values.externalSecrets.vault.version | default "v2" }}
      auth:
        {{- if .Values.externalSecrets.vault.tokenSecretRef }}
        tokenSecretRef:
          name: {{ .Values.externalSecrets.vault.tokenSecretRef.name }}
          key: {{ .Values.externalSecrets.vault.tokenSecretRef.key | default "token" }}
        {{- else }}
        kubernetes:
          mountPath: {{ .Values.externalSecrets.vault.kubernetesMountPath | default "kubernetes" }}
          role: {{ .Values.externalSecrets.vault.kubernetesRole | default "azile-mdm" }}
          serviceAccountRef:
            name: {{ include "azile-mdm.fullname" . }}-external-secrets
        {{- end }}
{{- end }}

{{- end }}
