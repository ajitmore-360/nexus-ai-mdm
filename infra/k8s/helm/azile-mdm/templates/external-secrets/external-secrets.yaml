{{/*
=============================================================================
ExternalSecret resources â€” pull secrets from the configured backend and
materialize them as native Kubernetes Secrets that pods reference via
secretKeyRef.

Creates three secrets matching the names expected by service deployments:
  azile-mdm-db-secret           â†’ DATABASE_URL
  azile-mdm-redis-secret        â†’ REDIS_URL
  azile-mdm-jwt-secret          â†’ JWT_SECRET
  azile-mdm-encryption-secret   â†’ FIELD_ENCRYPTION_KEY

Secrets are refreshed on the interval defined in externalSecrets.refreshInterval.
=============================================================================
*/}}
{{- if .Values.externalSecrets.enabled }}

{{- $storeName := "" }}
{{- if eq .Values.externalSecrets.provider "aws" }}
  {{- $storeName = printf "%s-aws-secretsmanager" (include "azile-mdm.fullname" .) }}
{{- else if eq .Values.externalSecrets.provider "vault" }}
  {{- $storeName = printf "%s-vault" (include "azile-mdm.fullname" .) }}
{{- end }}

---
# â”€â”€ Database credentials â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azile-mdm-db-secret
  namespace: {{ include "azile-mdm.namespace" . }}
  labels:
    {{- include "azile-mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: azile-mdm-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "azile-mdm" }}/database
        property: url
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "azile-mdm" }}/database
        property: url
        {{- end }}

---
# â”€â”€ Redis credentials â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azile-mdm-redis-secret
  namespace: {{ include "azile-mdm.namespace" . }}
  labels:
    {{- include "azile-mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: azile-mdm-redis-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: REDIS_URL
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "azile-mdm" }}/redis
        property: url
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "azile-mdm" }}/redis
        property: url
        {{- end }}

---
# â”€â”€ JWT + API bearer token â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azile-mdm-jwt-secret
  namespace: {{ include "azile-mdm.namespace" . }}
  labels:
    {{- include "azile-mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: azile-mdm-jwt-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "azile-mdm" }}/auth
        property: jwt_secret
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "azile-mdm" }}/auth
        property: jwt_secret
        {{- end }}
    - secretKey: API_BEARER_TOKEN
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "azile-mdm" }}/auth
        property: api_bearer_token
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "azile-mdm" }}/auth
        property: api_bearer_token
        {{- end }}

---
# â”€â”€ Field-level PII encryption key â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azile-mdm-encryption-secret
  namespace: {{ include "azile-mdm.namespace" . }}
  labels:
    {{- include "azile-mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "24h" }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: azile-mdm-encryption-secret
    creationPolicy: Owner
    # Retain on deletion: losing this key makes encrypted PII permanently unreadable.
    deletionPolicy: Retain
  data:
    - secretKey: FIELD_ENCRYPTION_KEY
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "azile-mdm" }}/encryption
        property: field_encryption_key
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "azile-mdm" }}/encryption
        property: field_encryption_key
        {{- end }}

{{- end }}
