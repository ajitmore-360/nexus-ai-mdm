{{/*
=============================================================================
API Gateway â€” Deployment
Port: 8080
Routes: all public API traffic; proxies to internal services
=============================================================================
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "azile-mdm.fullname" . }}-{{ .Values.apiGateway.name }}
  namespace: {{ include "azile-mdm.namespace" . }}
  labels:
    {{- include "azile-mdm.serviceLabels" (dict "root" . "service" .Values.apiGateway.name) | nindent 4 }}
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      {{- include "azile-mdm.serviceSelectorLabels" (dict "root" . "service" .Values.apiGateway.name) | nindent 6 }}
  strategy:
    type: {{ .Values.apiGateway.strategy.type }}
    {{- if eq .Values.apiGateway.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.apiGateway.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.apiGateway.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "azile-mdm.serviceLabels" (dict "root" . "service" .Values.apiGateway.name) | nindent 8 }}
      annotations:
        # Force pod restart when ConfigMap changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-gateway
          image: "{{ tpl .Values.apiGateway.image.repository . }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apiGateway.port }}
              protocol: TCP
          env:
            # ---- Non-secret env from ConfigMap --------------------------------
            - name: GATEWAY_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: GATEWAY_HOST
            - name: GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: GATEWAY_PORT
            - name: REQUEST_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: REQUEST_TIMEOUT_SECONDS
            - name: MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: MAX_RETRIES
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: ALLOWED_ORIGINS
            - name: MDM_CORE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: MDM_CORE_URL
            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: AI_SERVICE_URL
            - name: INGEST_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: INGEST_SERVICE_URL
            - name: POLICY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: POLICY_SERVICE_URL
            - name: SEARCH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: SEARCH_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: NOTIFICATION_SERVICE_URL
            - name: DISTRIBUTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: DISTRIBUTION_SERVICE_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: KAFKA_BROKERS
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: LOG_LEVEL
            - name: ENABLE_TRACING
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azile-mdm.fullname" . }}-config
                  key: ENABLE_TRACING
            # ---- Secret env refs ---------------------------------------------
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.redisUrlKey }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.jwtSecretKey }}
          livenessProbe:
            httpGet:
              path: {{ .Values.apiGateway.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.apiGateway.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiGateway.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.apiGateway.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.apiGateway.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.apiGateway.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.apiGateway.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiGateway.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.apiGateway.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.apiGateway.probes.readiness.failureThreshold }}
          resources:
            {{- include "azile-mdm.resources" .Values.apiGateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "azile-mdm.serviceSelectorLabels" (dict "root" . "service" .Values.apiGateway.name) | nindent 20 }}
                topologyKey: kubernetes.io/hostname
