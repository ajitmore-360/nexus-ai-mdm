{{/*
=============================================================================
Azile AI MDM Platform â€” cert-manager ClusterIssuer
Provisions Let's Encrypt TLS certificates automatically.
Requires cert-manager to be installed in the cluster:
  helm install cert-manager jetstack/cert-manager --set installCRDs=true
=============================================================================
*/}}
{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.issuerName }}
  labels:
    {{- include "azile-mdm.labels" . | nindent 4 }}
spec:
  acme:
    # Let's Encrypt ACME server
    # Use staging for testing: https://acme-staging-v02.api.letsencrypt.org/directory
    server: {{ .Values.certManager.acmeServer }}
    email: {{ .Values.certManager.acmeEmail | quote }}
    privateKeySecretRef:
      name: {{ .Values.certManager.issuerName }}-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.className }}
{{- end }}
