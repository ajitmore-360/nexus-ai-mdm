{{- if .Values.aiService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "azile-mdm.fullname" . }}-{{ .Values.aiService.name }}
  namespace: {{ include "azile-mdm.namespace" . }}
  labels:
    {{- include "azile-mdm.serviceLabels" (dict "root" . "service" .Values.aiService.name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "azile-mdm.fullname" . }}-{{ .Values.aiService.name }}
  minReplicas: {{ .Values.aiService.hpa.minReplicas }}
  maxReplicas: {{ .Values.aiService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.aiService.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.aiService.hpa.targetMemoryUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
{{- end }}
