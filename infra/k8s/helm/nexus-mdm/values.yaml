# -----------------------------------------------------------------------------
# EXTERNAL SECRETS (optional — requires external-secrets operator)
# -----------------------------------------------------------------------------
# Install the operator before enabling:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets --create-namespace
#
# Supported providers: aws | vault
# When disabled, secrets must be pre-created manually (see templates/secrets.yaml).
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: false
  provider: ""          # "aws" or "vault"
  refreshInterval: "1h"

  aws:
    region: ""           # e.g. "us-east-1"
    roleArn: ""          # IRSA role ARN; leave empty to use node IAM role
    secretPrefix: "nexus-mdm"

  vault:
    server: ""           # e.g. "https://vault.internal:8200"
    path: "secret"
    version: "v2"
    secretPrefix: "nexus-mdm"
    kubernetesMountPath: "kubernetes"
    kubernetesRole: "nexus-mdm"
