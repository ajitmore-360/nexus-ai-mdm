# =============================================================================
# Nexus AI MDM Platform — Helm Values
# =============================================================================
# All values here are production-safe defaults.
# Override per-environment using --values overlays/production.yaml, etc.
# =============================================================================

# -----------------------------------------------------------------------------
# GLOBAL
# -----------------------------------------------------------------------------
global:
  imageRegistry: "ghcr.io/nexus-mdm"
  imagePullPolicy: IfNotPresent
  namespace: nexus-mdm
  # imagePullSecrets:
  #   - name: nexus-registry-credentials

# -----------------------------------------------------------------------------
# INGRESS
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: "api.nexus-mdm.example.com"
  tls:
    enabled: true
    secretName: nexus-mdm-tls
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: letsencrypt-prod

# -----------------------------------------------------------------------------
# CERT-MANAGER (TLS via Let's Encrypt)
# -----------------------------------------------------------------------------
certManager:
  # Set to true once cert-manager is installed in the cluster.
  # Install: helm install cert-manager jetstack/cert-manager --set installCRDs=true
  enabled: true
  issuerName: letsencrypt-prod
  # Use https://acme-staging-v02.api.letsencrypt.org/directory for testing
  acmeServer: "https://acme-v02.api.letsencrypt.org/directory"
  # Replace with the ops team email — used for Let's Encrypt expiry notifications
  acmeEmail: "ops@nexus-mdm.example.com"

# -----------------------------------------------------------------------------
# AUTHENTICATION
# -----------------------------------------------------------------------------
auth:
  # Reference to an existing Secret containing JWT_SECRET key
  existingSecret: nexus-mdm-jwt-secret
  jwtSecretKey: JWT_SECRET
  # Token lifetime in seconds (24h default)
  tokenLifetimeSecs: 86400

# -----------------------------------------------------------------------------
# POSTGRESQL (external — deployed separately)
# -----------------------------------------------------------------------------
postgresql:
  host: nexus-postgres
  port: 5432
  database: nexus_mdm
  # Existing Secret must contain DATABASE_URL key
  existingSecret: nexus-mdm-db-secret
  databaseUrlKey: DATABASE_URL
  # Connection pool settings (overridable per-service)
  maxConnections: 50
  minConnections: 5
  acquireTimeoutSecs: 10
  idleTimeoutSecs: 600
  maxLifetimeSecs: 1800

# -----------------------------------------------------------------------------
# REDIS (external — deployed separately)
# -----------------------------------------------------------------------------
redis:
  host: nexus-redis
  port: 6379
  # Existing Secret must contain REDIS_URL key
  existingSecret: nexus-mdm-redis-secret
  redisUrlKey: REDIS_URL
  keyPrefix: "nexus:"
  # Rate limiter defaults (requests per window)
  rateLimitRequests: 100
  rateLimitWindowSecs: 60

# -----------------------------------------------------------------------------
# FIELD-LEVEL PII ENCRYPTION
# -----------------------------------------------------------------------------
fieldEncryption:
  # Existing Secret must contain a FIELD_ENCRYPTION_KEY entry (32-byte hex key).
  # Generate: openssl rand -hex 32
  # When externalSecrets.enabled=true the ExternalSecret controller creates this
  # secret automatically; otherwise create it manually before deploying:
  #   kubectl create secret generic nexus-mdm-encryption-secret \
  #     --from-literal=FIELD_ENCRYPTION_KEY=$(openssl rand -hex 32)
  existingSecret: nexus-mdm-encryption-secret
  encryptionKeyKey: FIELD_ENCRYPTION_KEY

# -----------------------------------------------------------------------------
# KAFKA (external — deployed separately)
# -----------------------------------------------------------------------------
kafka:
  brokers: "nexus-kafka:9092"
  # Topics used by the platform
  topics:
    entityEvents: nexus.entity.events
    matchEvents: nexus.match.events
    auditLog: nexus.audit.log
    notifications: nexus.notifications
  # Consumer group prefix
  groupIdPrefix: "nexus-mdm"

# -----------------------------------------------------------------------------
# OPA (external — deployed separately)
# -----------------------------------------------------------------------------
opa:
  url: "http://nexus-opa:8181"
  timeoutSecs: 5

# -----------------------------------------------------------------------------
# OBSERVABILITY
# -----------------------------------------------------------------------------
observability:
  logLevel: info
  enableTracing: true
  # Set to your OTLP collector endpoint if using OpenTelemetry
  otlpEndpoint: ""

# =============================================================================
# SERVICE DEFINITIONS
# Each service section controls: image, replicas, resources, HPA, probes
# =============================================================================

# -----------------------------------------------------------------------------
# API GATEWAY  (port 8080)
# -----------------------------------------------------------------------------
apiGateway:
  name: api-gateway
  image:
    repository: "{{ .Values.global.imageRegistry }}/api-gateway"
    tag: "1.0.0"
    pullPolicy: "{{ .Values.global.imagePullPolicy }}"
  replicas: 2
  port: 8080
  env:
    GATEWAY_HOST: "0.0.0.0"
    GATEWAY_PORT: "8080"
    REQUEST_TIMEOUT_SECONDS: "30"
    MAX_RETRIES: "3"
    ALLOWED_ORIGINS: "https://app.nexus-mdm.example.com"
    LOG_LEVEL: "info"
    ENABLE_TRACING: "true"
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Pod disruption budget
  pdb:
    enabled: true
    minAvailable: 1

# -----------------------------------------------------------------------------
# MDM CORE  (port 8081)
# -----------------------------------------------------------------------------
mdmCore:
  name: mdm-core
  image:
    repository: "{{ .Values.global.imageRegistry }}/mdm-core"
    tag: "1.0.0"
    pullPolicy: "{{ .Values.global.imagePullPolicy }}"
  replicas: 2
  port: 8081
  env:
    MDM_CORE_HOST: "0.0.0.0"
    MDM_CORE_PORT: "8081"
    APP_ENV: "production"
    RUST_LOG: "info"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health/ready
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  pdb:
    enabled: true
    minAvailable: 1

# -----------------------------------------------------------------------------
# AI SERVICE  (port 8082)
# -----------------------------------------------------------------------------
aiService:
  name: ai-service
  image:
    repository: "{{ .Values.global.imageRegistry }}/ai-service"
    tag: "1.0.0"
    pullPolicy: "{{ .Values.global.imagePullPolicy }}"
  replicas: 2
  port: 8082
  env:
    AI_SERVICE_PORT: "8082"
    AI_SERVICE_HOST: "0.0.0.0"
    # Ollama LLM backend — override with your cluster's Ollama endpoint
    OLLAMA_URL: "http://nexus-ollama:11434"
    LLM_MODEL: "llama3.2"
    EMBED_MODEL: "nomic-embed-text"
    LLM_TEMPERATURE: "0.1"
    LLM_MAX_TOKENS: "4096"
    LLM_TIMEOUT_SECS: "120"
    RUST_LOG: "info"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  pdb:
    enabled: true
    minAvailable: 1

# -----------------------------------------------------------------------------
# INGEST SERVICE  (port 8083)
# -----------------------------------------------------------------------------
