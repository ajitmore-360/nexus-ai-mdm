# -----------------------------------------------------------------------------
# KAFKA EVENT SERVICE  (background worker + health HTTP on :8087)
# -----------------------------------------------------------------------------
kafkaEventService:
  name: kafka-event-service
  image:
    repository: "{{ .Values.global.imageRegistry }}/kafka-event-service"
    tag: "1.0.0"
    pullPolicy: "{{ .Values.global.imagePullPolicy }}"
  # Workers are stateless outbox processors — 2 replicas for HA
  replicas: 2
  healthPort: 8087
  env:
    OUTBOX_POLL_INTERVAL_MS: "500"
    OUTBOX_BATCH_SIZE: "100"
    RUST_LOG: "info"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
