{{/*
=============================================================================
Kafka Event Service — HPA
CPU-only metric — worker has no HTTP port, memory growth is bounded.
=============================================================================
*/}}
{{- if .Values.kafkaEventService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nexus-mdm.fullname" . }}-{{ .Values.kafkaEventService.name }}
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.serviceLabels" (dict "root" . "service" .Values.kafkaEventService.name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nexus-mdm.fullname" . }}-{{ .Values.kafkaEventService.name }}
  minReplicas: {{ .Values.kafkaEventService.hpa.minReplicas }}
  maxReplicas: {{ .Values.kafkaEventService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.kafkaEventService.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.kafkaEventService.hpa.targetMemoryUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      # Longer cooldown: allow in-flight outbox batches to complete
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
{{- end }}
