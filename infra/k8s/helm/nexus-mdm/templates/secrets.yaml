{{/*
=============================================================================
Nexus AI MDM Platform — Secret Reference Template
=============================================================================
This template documents how secrets are wired into the platform.
Actual secret values are NEVER stored in Helm values or this chart.
They live in Kubernetes Secrets that must be pre-created before install:

  1. nexus-mdm-db-secret          — DATABASE_URL
  2. nexus-mdm-redis-secret        — REDIS_URL
  3. nexus-mdm-jwt-secret          — JWT_SECRET

Create them before helm install:

  kubectl create secret generic nexus-mdm-db-secret \
    --from-literal=DATABASE_URL="postgres://user:pass@nexus-postgres:5432/nexus_mdm" \
    --namespace nexus-mdm

  kubectl create secret generic nexus-mdm-redis-secret \
    --from-literal=REDIS_URL="redis://:password@nexus-redis:6379" \
    --namespace nexus-mdm

  kubectl create secret generic nexus-mdm-jwt-secret \
    --from-literal=JWT_SECRET="<256-bit-random-secret>" \
    --namespace nexus-mdm

The service Deployments reference these secrets via secretKeyRef.
=============================================================================
*/}}
{{/*
  This file intentionally renders no Kubernetes objects.
  Secret objects are external pre-requisites (see NOTES.txt).
  The actual secretKeyRef wiring is inside each service Deployment template.

  If you want this chart to create placeholder Secrets (e.g. in CI with
  test credentials), override the values below and uncomment this block.
*/}}

{{- if .Values.createTestSecrets }}
# ============================================================
# WARNING: Test-only secrets — DO NOT USE IN PRODUCTION
# ============================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.existingSecret }}
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    nexus-mdm/secret-type: database
type: Opaque
stringData:
  {{ .Values.postgresql.databaseUrlKey }}: {{ .Values.testSecrets.databaseUrl | required "testSecrets.databaseUrl is required when createTestSecrets=true" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.existingSecret }}
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    nexus-mdm/secret-type: cache
type: Opaque
stringData:
  {{ .Values.redis.redisUrlKey }}: {{ .Values.testSecrets.redisUrl | required "testSecrets.redisUrl is required when createTestSecrets=true" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.existingSecret }}
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    nexus-mdm/secret-type: auth
type: Opaque
stringData:
  {{ .Values.auth.jwtSecretKey }}: {{ .Values.testSecrets.jwtSecret | required "testSecrets.jwtSecret is required when createTestSecrets=true" | quote }}
{{- end }}
