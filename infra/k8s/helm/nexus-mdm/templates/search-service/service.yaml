apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus-mdm.fullname" . }}-{{ .Values.searchService.name }}
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.serviceLabels" (dict "root" . "service" .Values.searchService.name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nexus-mdm.serviceSelectorLabels" (dict "root" . "service" .Values.searchService.name) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.searchService.port }}
      targetPort: http
      protocol: TCP
