{{/*
=============================================================================
ServiceAccount for External Secrets Operator authentication.

Used by the ClusterSecretStore to authenticate with the secret backend:
  - AWS Secrets Manager: IRSA (IAM Role for Service Accounts) via OIDC.
    The roleArn annotation causes the EKS pod-identity webhook to inject
    AWS credentials. Requires externalSecrets.aws.roleArn to be set.
  - HashiCorp Vault: Kubernetes auth. The ServiceAccount token is submitted
    to Vault's /auth/<mount>/login endpoint to exchange for a Vault token.

Rendered only when externalSecrets.enabled is true.
=============================================================================
*/}}
{{- if .Values.externalSecrets.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nexus-mdm.fullname" . }}-external-secrets
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.labels" . | nindent 4 }}
  {{- if and (eq .Values.externalSecrets.provider "aws") .Values.externalSecrets.aws.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.externalSecrets.aws.roleArn | quote }}
    eks.amazonaws.com/token-expiration: "86400"
  {{- end }}
{{- end }}
