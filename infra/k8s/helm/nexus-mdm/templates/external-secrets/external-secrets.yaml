{{/*
=============================================================================
ExternalSecret resources — pull secrets from the configured backend and
materialize them as native Kubernetes Secrets that pods reference via
secretKeyRef.

Creates three secrets matching the names expected by service deployments:
  nexus-mdm-db-secret           → DATABASE_URL
  nexus-mdm-redis-secret        → REDIS_URL
  nexus-mdm-jwt-secret          → JWT_SECRET
  nexus-mdm-encryption-secret   → FIELD_ENCRYPTION_KEY

Secrets are refreshed on the interval defined in externalSecrets.refreshInterval.
=============================================================================
*/}}
{{- if .Values.externalSecrets.enabled }}

{{- $storeName := "" }}
{{- if eq .Values.externalSecrets.provider "aws" }}
  {{- $storeName = printf "%s-aws-secretsmanager" (include "nexus-mdm.fullname" .) }}
{{- else if eq .Values.externalSecrets.provider "vault" }}
  {{- $storeName = printf "%s-vault" (include "nexus-mdm.fullname" .) }}
{{- end }}

---
# ── Database credentials ──────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-mdm-db-secret
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: nexus-mdm-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "nexus-mdm" }}/database
        property: url
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "nexus-mdm" }}/database
        property: url
        {{- end }}

---
# ── Redis credentials ─────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-mdm-redis-secret
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: nexus-mdm-redis-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: REDIS_URL
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "nexus-mdm" }}/redis
        property: url
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "nexus-mdm" }}/redis
        property: url
        {{- end }}

---
# ── JWT + API bearer token ────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-mdm-jwt-secret
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: nexus-mdm-jwt-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "nexus-mdm" }}/auth
        property: jwt_secret
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "nexus-mdm" }}/auth
        property: jwt_secret
        {{- end }}
    - secretKey: API_BEARER_TOKEN
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "nexus-mdm" }}/auth
        property: api_bearer_token
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "nexus-mdm" }}/auth
        property: api_bearer_token
        {{- end }}

---
# ── Field-level PII encryption key ───────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-mdm-encryption-secret
  namespace: {{ include "nexus-mdm.namespace" . }}
  labels:
    {{- include "nexus-mdm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "24h" }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: ClusterSecretStore
  target:
    name: nexus-mdm-encryption-secret
    creationPolicy: Owner
    # Retain on deletion: losing this key makes encrypted PII permanently unreadable.
    deletionPolicy: Retain
  data:
    - secretKey: FIELD_ENCRYPTION_KEY
      remoteRef:
        {{- if eq .Values.externalSecrets.provider "aws" }}
        key: {{ .Values.externalSecrets.aws.secretPrefix | default "nexus-mdm" }}/encryption
        property: field_encryption_key
        {{- else if eq .Values.externalSecrets.provider "vault" }}
        key: {{ .Values.externalSecrets.vault.secretPrefix | default "nexus-mdm" }}/encryption
        property: field_encryption_key
        {{- end }}

{{- end }}
