apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    isDefault: false
    version: 1
    editable: true
    jsonData:
      # Link traces → logs via Loki (add Loki datasource when log aggregation is added)
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      # Derive RED metrics from span data stored in Prometheus
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
        queries:
          - name: "Request rate"
            query: 'rate(traces_spanmetrics_calls_total{$__tags}[5m])'
          - name: "Error rate"
            query: 'rate(traces_spanmetrics_calls_total{$__tags, status_code="STATUS_CODE_ERROR"}[5m])'
          - name: "p99 latency"
            query: 'histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency_bucket{$__tags}[5m])) by (le))'
      lokiSearch:
        datasourceUid: ''   # populate when Loki is added
