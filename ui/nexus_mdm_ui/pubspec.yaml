name: azile_mdm_ui
description: Azile AI MDM Platform - Enterprise Master Data Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # Network
  dio: ^5.4.0
  web_socket_channel: ^3.0.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # URL strategy â€” path-based URLs on Flutter Web (no # hash)
  flutter_web_plugins:
    sdk: flutter

  # Utils
  intl: ^0.19.0
  get_it: ^7.7.0
  shared_preferences: ^2.2.3

  # File picker â€” cross-platform CSV file selection for large-scale ingest
  file_picker: ^8.1.2

  # Security â€” encrypted storage for auth tokens
  # Uses Keychain (iOS/macOS), Keystore (Android), libsecret (Linux), DPAPI (Windows)
  flutter_secure_storage: ^9.2.2

  # OAuth2 / OIDC PKCE â€” SSO login for Google, Azure AD, Okta
  # Provides SHA-256 for PKCE code_challenge computation (S256 method).
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
