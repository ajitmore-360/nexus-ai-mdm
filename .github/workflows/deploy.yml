name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

env:
  REGISTRY:   ghcr.io
  IMAGE_ORG:  ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build and push Docker images for all Rust services
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - api-gateway
          - mdm-core
          - ai-service
          - ingest-service
          - policy-service
          - search-service
          - notification-service
          - distribution-service
          - kafka-event-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nexus-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Build and push Flutter web image
  # ─────────────────────────────────────────────────────────────────────────
  build-ui:
    name: Build Flutter UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push UI
        uses: docker/build-push-action@v5
        with:
          context: ui/nexus_mdm_ui
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nexus-ui:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nexus-ui:${{ github.sha }}
          cache-from: type=gha,scope=nexus-ui
          cache-to:   type=gha,scope=nexus-ui,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy to Kubernetes (on tag push only)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push, build-ui]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Update image tags in Helm values
        run: |
          TAG=${GITHUB_REF_NAME}
          sed -i "s/tag: latest/tag: ${TAG}/g" infra/k8s/helm/nexus-mdm/values.yaml

      - name: Helm upgrade
        run: |
          helm upgrade --install nexus-mdm ./infra/k8s/helm/nexus-mdm \
            --namespace nexus-mdm \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.IMAGE_ORG }} \
            --set global.imageTag=${{ github.ref_name }}
