[workspace]

resolver = "2"

members = [
    "services/api-gateway",
    "services/mdm-core",
    "services/ai-service",
    "services/ingest-service",
    "services/policy-service",
    "services/kafka-event-service",
    "services/notification-service",
    "services/search-service",
    "services/distribution-service",
    "shared/contracts",
    "shared/database",
    "shared/redis",
    "shared/auth",
    "shared/telemetry",
    "shared/security",
    "services/enrichment-service",
    "services/tenant-service",
    "tools/nexus-datagen",
]

[workspace.dependencies.database]
path = "shared/database"

[workspace.dependencies.nexus-redis]
path = "shared/redis"

[workspace.dependencies.nexus-auth]
path = "shared/auth"

[workspace.dependencies.nexus-telemetry]
path = "shared/telemetry"

[workspace.dependencies.nexus-security]
path = "shared/security"

#
# Shared workspace dependencies
#

[workspace.dependencies]

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.7"
tower = "0.5"

tower-http = { version = "0.6", features = [
    "trace",
    "cors",
] }

# Serialization

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# UUID
uuid = { version = "1", features = ["serde", "v4"] }

chrono = { version = "0.4", features = [
    "serde",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
] }

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# ========================================
# DATABASE
# ========================================
#

sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

#
# ========================================
# VALIDATION
# ========================================
#

validator = { version = "0.18", features = [
    "derive",
] }

dotenvy = "0.15"

rdkafka = { version = "0.36", features = ["cmake-build"] }

futures = "0.3"

config = "0.14"

# Redis
deadpool-redis = { version = "0.14", features = ["rt_tokio_1"] }
redis          = { version = "0.24", features = ["aio", "tokio-comp", "streams"] }

# Auth
jsonwebtoken = "9"
bcrypt       = "0.15"
sha2         = "0.10"
hex          = "0.4"
hmac         = "0.12"

# Observability
prometheus             = { version = "0.13", features = ["process"] }
opentelemetry          = { version = "0.21", features = ["trace"] }
opentelemetry_sdk      = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp     = { version = "0.14", features = ["grpc-tonic"] }
tracing-opentelemetry  = "0.22"