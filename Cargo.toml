[workspace]

resolver = "2"

members = [
    "services/api-gateway",
    "services/mdm-core",
    "services/ai-service",
    "services/ingest-service", 
    "services/policy-service",
    "services/kafka-event-service",
    "shared/contracts",
]

#
# Shared workspace dependencies
#

[workspace.dependencies]

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.7"
tower = "0.5"

tower-http = { version = "0.6", features = [
    "trace",
    "cors",
] }

# Serialization

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# UUID
uuid = { version = "1", features = ["serde", "v4"] }

chrono = { version = "0.4", features = [
    "serde",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
] }

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# ========================================
# DATABASE
# ========================================
#

sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }

#
# ========================================
# VALIDATION
# ========================================
#

validator = { version = "0.18", features = [
    "derive",
] }

dotenvy = "0.15"

rdkafka = {
    version = "0.36",
    features = ["cmake-build"]
}

futures = "0.3"

config = "0.14"